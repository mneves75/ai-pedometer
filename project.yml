name: AIPedometer
options:
  bundleIdPrefix: com.mneves
  deploymentTarget:
    iOS: 26.0
    watchOS: 26.0
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  postGenCommand: bash Scripts/restore-entitlements.sh
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.2
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_SWIFT_TESTING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 56
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Only `SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY` survives here, and it is the only one that ever
    # did anything. Xcode 27 recognizes exactly 19 `SWIFT_UPCOMING_FEATURE_*` settings (see
    # SWBUniversalPlatform.framework/Resources/Swift.xcspec); this list previously declared 20, of
    # which 16 were names Xcode does not define at all — `..._SWIFT_6` (the real one is `..._6_0`),
    # `..._ISOLATED_DEFAULT_ARGUMENTS` (`..._ISOLATED_DEFAULT_VALUES`), `..._STRICT_CONCURRENCY`,
    # `..._STRICT_DOUBLE`, `..._PACK_ITERATION` and the rest — so Xcode silently ignored them.
    # The other three were real but are already implied by `SWIFT_VERSION: 6.2`. Verified against a
    # build log: the compiler received exactly one `-enable-upcoming-feature ExistentialAny`.
    # Do not re-add a flag without checking Swift.xcspec and confirming it reaches swiftc.
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_ENHANCED_SECURITY: YES
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    revision: 450e438e55f8fb7e2aa86e856fd8d16d59ebd12f
schemes:
  AIPedometer:
    shared: true
    build:
      targets:
        AIPedometer:
          - run
          - test
          - profile
          - analyze
          - archive
        AIPedometerTests:
          - test
        AIPedometerUITests:
          - test
    run:
      config: Debug
      storeKitConfiguration: StoreKit/TipJar.storekit
    test:
      config: Debug
      targets:
        - AIPedometerTests
        - AIPedometerUITests
targets:
  AIPedometer:
    type: application
    platform: iOS
    sources:
      - path: AIPedometer
        excludes:
          - .osgrep/**
      - path: Shared
      - path: StoreKit
        buildPhase: none
    resources:
      - path: AIPedometer/Resources
      - path: Shared/Resources
    entitlements:
      path: AIPedometer/Resources/AIPedometer.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mneves.aipedometer
        PRODUCT_NAME: AIPedometer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: AIPedometer/Resources/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 MNeves"
        ENABLE_BACKGROUND_MODES: YES
        # `health-updates` was declared but never exercised: no HKObserverQuery,
        # HKAnchoredObjectQuery or enableBackgroundDelivery call exists anywhere in the app.
        # The only background work is BGAppRefreshTask, which `fetch` alone covers.
        INFOPLIST_KEY_UIBackgroundModes: fetch
    dependencies:
      - target: AIPedometerWatch
      - target: AIPedometerWidgets
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
  AIPedometerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AIPedometerWidgets
      - path: Shared
    resources:
      - path: AIPedometerWidgets/Resources
    entitlements:
      path: AIPedometerWidgets/Resources/AIPedometerWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mneves.aipedometer.widgets
        INFOPLIST_FILE: AIPedometerWidgets/Resources/Info.plist
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies: []
  AIPedometerWatch:
    type: application
    platform: watchOS
    sources:
      - path: AIPedometerWatch
      - path: Shared
    resources:
      - path: AIPedometerWatch/Resources
    entitlements:
      path: AIPedometerWatch/Resources/AIPedometerWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mneves.aipedometer.watch
        INFOPLIST_FILE: AIPedometerWatch/Resources/Info.plist
        WK_COMPANION_APP_BUNDLE_IDENTIFIER: com.mneves.aipedometer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Must be YES: the watch app ships embedded at AIPedometer.app/Watch/. With SKIP_INSTALL=NO it is
        # ALSO installed as a top-level product, so an archive contains two apps under
        # Products/Applications, Xcode cannot identify the primary one, and it writes no
        # ApplicationProperties — which makes `xcodebuild -exportArchive` report zero valid distribution
        # methods and blocks every App Store/TestFlight upload.
        SKIP_INSTALL: YES
        # watchOS does not support arm64e; opt out of the Enhanced Security pointer-auth cascade.
        ENABLE_POINTER_AUTHENTICATION: NO
    dependencies: []
  AIPedometerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIPedometerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mneves.aipedometer.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AIPedometer
  AIPedometerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AIPedometerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mneves.aipedometer.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AIPedometer
