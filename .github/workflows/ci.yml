name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select a supported Xcode (26.x or 27.x)
        run: |
          # Must track Scripts/lib/xcode-toolchain.sh. A hard 26-only pin silently diverged from
          # local hosts once they moved to 27, and the runner image rotating off 26 would have
          # killed CI outright. Newest supported wins; the resolved build is recorded as evidence.
          XCODE_PATH=""
          for candidate in $(printf '%s\n' /Applications/Xcode_27*.app /Applications/Xcode_26*.app | sort -rV); do
            [[ -d "${candidate}" ]] || continue
            XCODE_PATH="${candidate}"
            break
          done
          if [[ -z "${XCODE_PATH}" ]]; then
            echo "No supported Xcode (26.x or 27.x) found under /Applications" >&2
            ls -d /Applications/Xcode* 2>/dev/null >&2 || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        run: bash Scripts/install-ci-tools.sh ast-grep xcodegen ripgrep actionlint shellcheck

      - name: Preflight (host can actually build)
        # Enforced, not documented. Guidance-as-prose is followed inconsistently; a gate is not.
        # This also catches runner drift — if the image stops shipping a supported Xcode, this
        # fails in seconds with a named reason instead of minutes into a build.
        run: bash Scripts/preflight.sh

      - name: Lint workflows and shell scripts
        run: |
          actionlint
          shellcheck Scripts/*.sh Scripts/lib/*.sh Scripts/tests/*.sh Scripts/tests/fixtures/*.sh .githooks/pre-commit

      - name: Run exact staged-source guardrail
        run: bash .githooks/pre-commit

      - name: Run script tests
        run: |
          for test_script in Scripts/tests/*.sh; do
            echo "==> ${test_script}"
            /bin/bash "${test_script}"
          done

      - name: Generate Xcode project
        run: |
          xcodegen generate
          bash Scripts/verify-entitlements.sh
          bash Scripts/verify-swift-build-settings.sh
          bash Scripts/verify-revenuecat-lock.sh

      - name: Compile watchOS arm64_32
        run: |
          xcodebuild \
            -project AIPedometer.xcodeproj \
            -target AIPedometerWatch \
            -configuration Debug \
            -sdk watchos \
            ARCHS=arm64_32 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SYMROOT="${RUNNER_TEMP}/aipedometer-watch-arm64_32/Build" \
            OBJROOT="${RUNNER_TEMP}/aipedometer-watch-arm64_32/Intermediates" \
            SHARED_PRECOMPS_DIR="${RUNNER_TEMP}/aipedometer-watch-arm64_32/PrecompiledHeaders" \
            build

      - name: Run E2E (iOS Simulator)
        run: |
          rm -rf output/e2e-ci
          E2E_OUT_DIR=output/e2e-ci \
          E2E_DERIVED_DATA_ROOT="${RUNNER_TEMP}/aipedometer-e2e-derived-data" \
          E2E_ENABLE_WATCH=0 \
          E2E_ENABLE_SCREENSHOTS=0 \
          E2E_ERASE_IOS_SIM=1 \
          E2E_UI_TEST_ITERATIONS=1 \
          bash Scripts/e2e-simulator.sh

      - name: Publish E2E summary
        if: always()
        run: |
          if [[ -f output/e2e-ci/summary.md ]]; then
            cat output/e2e-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Resumo nao encontrado: output/e2e-ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            output/e2e-ci
            !output/e2e-ci/**/DerivedData*
