name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  # Superseded PR runs may be cancelled; a pushed commit on the default branch must finish,
  # because delivery requires a completed CI run for that exact SHA.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select a supported Xcode (26.x or 27.x)
        run: |
          # Must track Scripts/lib/xcode-toolchain.sh. A hard 26-only pin silently diverged from
          # local hosts once they moved to 27, and the runner image rotating off 26 would have
          # killed CI outright. Newest supported wins; the resolved build is recorded as evidence.
          XCODE_PATH=""
          for candidate in $(printf '%s\n' /Applications/Xcode_27*.app /Applications/Xcode_26*.app | sort -rV); do
            [[ -d "${candidate}" ]] || continue
            # A runner image can ship a beta or release candidate beside the stable build, and
            # `sort -rV` ranks it first. Release evidence must come from a released toolchain.
            case "${candidate}" in *[Bb]eta*|*_RC*|*Release_Candidate*) continue ;; esac
            XCODE_PATH="${candidate}"
            break
          done
          if [[ -z "${XCODE_PATH}" ]]; then
            echo "No supported Xcode (26.x or 27.x) found under /Applications" >&2
            ls -d /Applications/Xcode* 2>/dev/null >&2 || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: bash Scripts/install-ci-tools.sh xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          bash Scripts/verify-entitlements.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Build for CodeQL
        run: |
          xcodebuild \
            -scheme AIPedometer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
