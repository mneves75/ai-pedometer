name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select a supported Xcode (26.x or 27.x)
        run: |
          # Must track Scripts/lib/xcode-toolchain.sh. A hard 26-only pin silently diverged from
          # local hosts once they moved to 27, and the runner image rotating off 26 would have
          # killed CI outright. Newest supported wins; the resolved build is recorded as evidence.
          XCODE_PATH=""
          for candidate in $(printf '%s\n' /Applications/Xcode_27*.app /Applications/Xcode_26*.app | sort -rV); do
            [[ -d "${candidate}" ]] || continue
            XCODE_PATH="${candidate}"
            break
          done
          if [[ -z "${XCODE_PATH}" ]]; then
            echo "No supported Xcode (26.x or 27.x) found under /Applications" >&2
            ls -d /Applications/Xcode* 2>/dev/null >&2 || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: bash Scripts/install-ci-tools.sh xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          bash Scripts/verify-entitlements.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}

      - name: Build for CodeQL
        run: |
          xcodebuild \
            -scheme AIPedometer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
