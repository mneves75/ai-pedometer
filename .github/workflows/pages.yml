name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and stage public static site
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/pages-site"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"

          for file in index.html privacy.html styles.css app.js favicon.png site.webmanifest robots.txt sitemap.xml; do
            test -s "docs/${file}"
            cp "docs/${file}" "${STAGE}/${file}"
          done
          test -f docs/.nojekyll
          cp docs/.nojekyll "${STAGE}/.nojekyll"
          test -s docs/assets/product/app-icon.png
          test -s docs/assets/product/onboarding.webp
          cp -R docs/assets "${STAGE}/assets"

          # Ensure internal docs (agents, appstore, refactor, handoffs) are never published.
          if find "${STAGE}" -name '*.md' -print -quit | grep -q .; then
            echo "ERROR: Markdown files must not be staged in GitHub Pages output." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
          include-hidden-files: true

  deploy:
    needs: build
    # workflow_dispatch accepts any ref; only master may publish.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
